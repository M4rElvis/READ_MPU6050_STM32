[app]
platformio_cmd = platformio
cubemx_cmd = C:/Users/User/AppData/Local/Programs/STM32CubeMX/STM32CubeMX.exe
java_cmd = C:/Users/User/AppData/Local/Programs/STM32CubeMX/jre/bin/java.exe

[project]
cubemx_script_content = config load ${ioc_file_absolute_path}
	generate code ${project_dir_absolute_path}
	exit
platformio_ini_patch_content = [platformio]
	include_dir = Inc
	src_dir = Src
board = genericSTM32F103C8
ioc_file = MPU6050_STM32.ioc
cleanup_ignore = MPU6050_STM32.ioc
cleanup_use_git = False
inspect_ioc = True

